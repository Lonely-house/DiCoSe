# Same vendored UNet1d class, reduced width/depth for CPU numerical checks only.
model:
  query_dim: 16
  condition_dim: 16
  query_adapter: true
  unet:
    in_channels: 1
    out_channels: 1
    channels: 8
    patch_factor: 2
    patch_blocks: 1
    resnet_groups: 2
    kernel_multiplier_downsample: 2
    kernel_sizes_init: [1, 3, 7]
    multipliers: [1, 2, 2]
    factors: [2, 2]
    num_blocks: [1, 1]
    attentions: [false, false]
    attention_heads: 2
    attention_features: 4
    attention_multiplier: 2
    use_nearest_upsample: false
    use_skip_scale: true
    use_attention_bottleneck: false
    use_context_time: false
    context_channels: null
audio:
  sample_rate: 22050
  segment_samples: 256
data:
  train_manifest: artifacts/smoke/manifests/train.jsonl
  validation_manifest: artifacts/smoke/manifests/validation.jsonl
  embedding_cache: artifacts/smoke/text_embeddings.pt
train:
  seed: 42
  epochs: 2
  batch_size: 2
  num_workers: 0
  learning_rate: 0.001
  betas: [0.9, 0.99]
  weight_decay: 0.0
  device: cpu
  amp: false
  grad_clip: 1.0
  output_dir: artifacts/smoke/run
loss:
  wave_type: l1
  wave_weight: 1.0
  mrstft_weight: 0.1
  fft_sizes: [32, 64]
  hop_sizes: [8, 16]
  win_lengths: [32, 64]
  absence_weight: 0.1
