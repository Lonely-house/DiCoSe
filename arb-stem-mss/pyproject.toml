[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arb-stem-mss"
version = "0.1.0"
description = "Text-conditioned arbitrary-stem DET separation using the DiCoSe waveform U-Net"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.3",
  "numpy>=1.24",
  "scipy>=1.10",
  "soundfile>=0.12",
  "PyYAML>=6.0",
  "einops>=0.7",
  "einops-exts>=0.0.4",
  "typing-extensions>=4.8",
]

[project.optional-dependencies]
test = ["pytest>=8"]
clap = ["laion-clap>=1.1.6"]

[tool.setuptools.packages.find]
where = ["."]
include = ["arb_stem_mss*"]

[tool.setuptools.package-data]
arb_stem_mss = ["vendor/dicose/LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
